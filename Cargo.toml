[package]
name = "rustboard-api"
version = "0.1.4"
edition = "2024"

[dependencies]
async-trait = "0.1"
# Web framework
axum = "0.8"

# configuration
config = "0.15"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# error handling
thiserror = "2"

# Async runtime
tokio = { version = "1", features = ["macros", "parking_lot", "rt-multi-thread"] }

# Swagger
utoipa = "5"
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

