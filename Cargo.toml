[package]
name = "rustboard-api"
version = "0.1.3"
edition = "2024"

[dependencies]
async-trait = "0.1"
# Web framework
axum = "0.8"
config = "0.15"

# Serialization
serde = { version = "1", features = ["derive"] }

# error handling
thiserror = "2"

# Async runtime
tokio = { version = "1", features = ["macros", "parking_lot", "rt-multi-thread"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

